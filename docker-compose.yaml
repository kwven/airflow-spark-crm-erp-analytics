x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: airflow_jwt_secret
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
    PYTHONPATH: /opt/airflow
    HDFS_BASE_URI: hdfs://namenode:8020
    JDBC_URL: jdbc:postgresql://postgres-warehouse:5432/warehouse
    JDBC_USER: warehouse_user
    JDBC_PASSWORD: warehouse_pass
    SPARK_APP_JAR: /opt/airflow/spark/target/scala-2.12/crm-erp-analytic-spark_2.12-0.1.0.jar
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
    - ./spark:/opt/airflow/spark
    - ./data:/opt/airflow/data
  networks:
    - crm_erp_net

services:
  namenode:
    image: apache/hadoop:3.4.3
    container_name: namenode
    hostname: namenode
    user: "0:0"
    restart: unless-stopped
    environment:
      HDFS_NAMENODE_USER: root
      CLUSTER_NAME: crm-erp-analytics
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    command:
      [
        "bash",
        "-lc",
        "if [ ! -d /hadoop/dfs/name/current ]; then hdfs namenode -format -force -nonInteractive; fi && hdfs namenode"
      ]
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./data:/data:ro
      - ./docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks:
      - crm_erp_net

  datanode:
    image: apache/hadoop:3.4.3
    container_name: datanode
    hostname: datanode
    user: "0:0"
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      HDFS_DATANODE_USER: root
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
      - ./docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks:
      - crm_erp_net

  spark-master:
    build:
      context: ./docker/spark
      args:
        SPARK_VERSION: 3.5.8
        HADOOP_MAJOR: 3
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.master.Master",
        "--host",
        "spark-master",
        "--port",
        "7077",
        "--webui-port",
        "8080"
      ]
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - crm_erp_net

  spark-worker:
    build:
      context: ./docker/spark
      args:
        SPARK_VERSION: 3.5.8
        HADOOP_MAJOR: 3
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
        "--webui-port",
        "8081"
      ]
    ports:
      - "8081:8081"
    networks:
      - crm_erp_net

  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    hostname: postgres-airflow
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_airflow_data:/var/lib/postgresql/data
    networks:
      - crm_erp_net

  postgres-warehouse:
    image: postgres:15-alpine
    container_name: postgres-warehouse
    hostname: postgres-warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warehouse_user", "-d", "warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_warehouse_data:/var/lib/postgresql/data
      - ./sql/schemas:/docker-entrypoint-initdb.d
    networks:
      - crm_erp_net

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    hostname: airflow-init
    depends_on:
      airflow-permissions:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com \
          --password airflow
    restart: "no"

  airflow-permissions:
    <<: *airflow-common
    container_name: airflow-permissions
    hostname: airflow-permissions
    user: "0:0"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs/dag_processor && \
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs && \
        chmod -R ug+rwX /opt/airflow/logs && \
        chgrp -R 0 /opt/airflow/spark && \
        find /opt/airflow/spark -type d -exec chmod g+rws {} + && \
        find /opt/airflow/spark -type f -exec chmod g+rw {} +
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: airflow-api-server
    hostname: airflow-api-server
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    command: api-server
    ports:
      - "8088:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    command: scheduler
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    hostname: airflow-dag-processor
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor
    restart: unless-stopped

networks:
  crm_erp_net:
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode:
  pg_warehouse_data:
  pg_airflow_data:
